schema: spec-driven

context: |
  # AI DIAL Admin Frontend

  ## Tech Stack
  - Monorepo: Nx
  - Framework: Next.js 15 (App Router with [lang] i18n via next-international)
  - Language: TypeScript 5.9 (strict mode)
  - UI: React 19, Tailwind CSS 3 (preferred), SCSS (for external component overrides)
  - Auth: next-auth v4
  - State: React Context + custom hooks (no external state management)
  - API: Next.js server actions + occasional API routes
  - Testing: Vitest + React Testing Library (unit for utils, component tests for UI)
  - Linting: ESLint 9 + Prettier, husky + lint-staged pre-commit
  - Commits: Conventional commits (feat/fix/chore with optional scope)

  ## Key Libraries
  - @epam/ai-dial-ui-kit: Design system with base components
  - AG Grid for data grids (grid conventions are in .claude/rules/components.md §11)
  - ECharts for charts
  - Monaco Editor for code editing
  - @tabler/icons-react + @svgr/webpack for icons/SVGs
  - react-dnd for drag and drop
  - Custom validation context for standard form validation

  ## Path Alias
  - @/* -> apps/ai-dial-admin/*

  ## Commands
  - Dev server: `npm start` (localhost:4200)
  - Build: `npm run build`
  - Lint: `npm run lint` (also pre-commit via husky/lint-staged)
  - Typecheck: `npm run typecheck` (also pre-commit via husky, and a blocking CI job) — app source only
  - Typecheck (spec files): `npm run typecheck:specs` — reported, never blocking, until its ~720 errors
    are cleared; pre-commit prints the count, CI puts the worst files in the job summary
  - Format: `npm run format` (check) / `npm run format:write` (apply)
  - Tests: `npm run test` (also pre-push via husky)
  - Single test file: `npx vitest run src/path/to/file.spec.ts` (run from apps/ai-dial-admin/)
  - Single test by name: `npx vitest run src/path/to/file.spec.ts -t "pattern"`
  - Note: vitest must run from apps/ai-dial-admin/ for @/ path alias to resolve

  ## Architecture
  - Single app: apps/ai-dial-admin, all source under apps/ai-dial-admin/src/
  - Components: pragmatic organization in src/components/ — core app sections,
    reusable common components, entity views/lists with co-located related components
  - Theming: separate themes controlling color palette, icons and more via CSS variables
    with custom Tailwind palette
  - Error handling: error pages for server errors, toast notifications for action results
  - Backend APIs:
    - Core admin: github.com/epam/ai-dial-admin-backend
    - Deployment manager: github.com/epam/ai-dial-admin-deployment-manager-backend

  ### Routing
  - Next.js App Router with [lang] segment for i18n. Each entity: src/app/[lang]/<entity>/page.tsx
  - Data-fetching pages use `export const dynamic = 'force-dynamic'`

  ### Provider stack ([lang]/layout.tsx)
  I18nProvider → NextAuthProvider → AppContextProvider → ThemeProvider →
  RuleFolderProvider → PromptFolderProvider → NotificationProvider

  ### Entity pattern
  Each domain entity (adapters, models, applications, test-suites, etc.) follows:
  - View (components/<Entity>/View/View.tsx) — client component, manages tabs/local edits/save/discard.
    Gets originalEntity + etag from the page server component.
  - TabsContent — switches content per EntityViewTab.
  - List (components/<Entity>/List/) — uses BaseEntityList with column defs from constants/grid-columns/.

  ### Server actions
  Located at src/app/[lang]/<entity>/actions.ts ('use server'). Authenticate via getUserToken(),
  delegate to API classes in src/server/, return { success, data?, errorHeader?, errorMessage? }.

  ### Grid system
  GridView wraps AgGridWrapper wraps AgGridReact. Column definitions in constants/grid-columns/
  and components/<Entity>/utils/columns.tsx. Column state persists to localStorage via storageKey.

  ### i18n
  useI18n() returns t(). Keys in src/locales/en.ts. Domain keys grouped by <Entity>I18nKey enums
  in src/constants/i18n.ts. In tests, t() returns the key string as-is (mocked in test-setup.tsx).

  ### Test setup
  Vitest + jsdom. test-setup.tsx mocks: fetch, useI18n, useSession, all context providers,
  ResizeObserver, IntersectionObserver, createPortal. Tests co-locate as tests/<name>.spec.ts(x).

rules:
  proposal:
    - Keep proposals concise and focused on the problem and solution
    - Reference existing components/patterns when proposing changes
    - Include a "Non-goals" section to keep scope clear
    - Ask clarifying questions to gather details before finalizing the proposal
    - Investigate the current codebase for related functionality before proposing — don't duplicate what already exists
    - Consider impact on existing features — flag if the proposal could affect other parts of the app (shared components, contexts, API routes)
  design:
    - For component, context, and hook design, follow .claude/rules/components.md (design principles, Common-vs-feature placement, design-system reuse, styling, naming, state & memoization, i18n, grid)
    - For utility / pure-function design, follow .claude/rules/utils.md (purity, placement, determinism, testability)
    - For cross-cutting TypeScript standards (import alias, enums, type placement, control flow, constants/models split), follow .claude/rules/code-standards.md
    - For accessibility design (ARIA state, focus management, live regions, contrast against the theme tokens, keyboard parity, AG Grid specifics), follow .claude/rules/a11y.md
  specs:
    - Reference backend API contracts from ai-dial-admin-backend or ai-dial-admin-deployment-manager-backend
    - Include validation requirements for any form fields
    - Specify error/success notification behavior for actions
    - "Analytics: all Analytics specs live under openspec/specs/analytics/, which is a root index plus nine sub-capabilities — query-builder (the rail's four authoring views: Form, JSON, SQL, AI), query-viewer (execution, result grid, stat tiles, table and chart views), saved-queries, tables, conversations-listing, conversation-trace-listing, conversation-trace-detail, pipelines, evaluators. Add a requirement to the sub-capability that owns the behaviour, addressed as analytics/<sub>. openspec/specs/analytics/spec.md is the index and holds ONLY what every Analytics page shares (feature flag, menu group, API layer, server-side prefetch, structured-query DSL primitives) plus a routing table — when you add a sub-capability, add its row. Do NOT create a top-level analytics-* spec folder. The Analytics backend is the analytics-data-access-service (host: DIAL_ANALYTICS_API_URL); the feature is gated by ANALYTICS_ENABLED."
    - "Analytics archive retention: when archiving a change whose deltas touch the analytics capability, keep proposal.md and design.md and DELETE tasks.md and the specs/ delta folder. The archive step already folds the delta into openspec/specs/analytics/, so the archived copy is a duplicate an agent must read past, and a completed tasks.md answers neither what the system does nor why; proposal.md and design.md remain the only record of the alternatives and the accepted tradeoff. Before deleting a delta, verify each of its ADDED/MODIFIED requirements is present in the consolidated spec or explicitly REMOVED by a later delta — the 2026-08-31 saved-query-clone delta had never been folded in. This rule is Analytics-only; every other capability keeps the stock OpenSpec archive layout."
  tasks:
    - "REQUIRED, CHECK THIS FIRST: For changes with browser-observable acceptance criteria, you are required to ASK the user whether to add a verification task — never add it automatically, and never skip the question. When asking, explain what the task is: a dedicated task (placed after implementation, before the final quality-checks task) that runs the spec-browser-verify skill, which builds a VerificationRequest from the change's scenarios and spawns the spec-verification-gate sub-agent to check them against the running local app via the Playwright MCP (requires the local stack running with auth disabled), and requires resolving any `fail` verdicts before the change is complete. It is automated, not a manual testing task. Add the task only if the user confirms. To decide if the question applies, read each scenario's THEN clause: a scenario is browser-observable if its THEN describes UI state — an element present/absent, enabled/disabled, a navigation/redirect, or text shown. If ANY scenario in the change is browser-observable, you MUST ask — do not omit the question just because unit tests exist; having a unit test for the underlying logic does NOT make a scenario non-observable, they are separate tasks, not substitutes. The only case where the question may be omitted is when NO scenario's THEN clause describes UI (e.g. pure server-action contracts, model typing, util functions with no UI surface); in that case state in the task list why no verification task is needed. When server-side config (env vars set at launch) gates the behavior, still ask: scope the proposed task to the booted configuration that reproduces the reported case, and leave full-matrix coverage to unit tests."
    - Reference specific file paths and component names
    - Require unit tests for all new and updated code as a dedicated task
    - Keep tasks small enough to be reviewable in a single PR
    - For test-authoring rules (how to write tests — queries, mocks, per-type approach, cost discipline), follow .claude/rules/testing.md
    - IMPORTANT - Do not add "Manual check" tasks
    - Run all code quality checks (lint, format, tests) as a final task after all implementation tasks are complete
