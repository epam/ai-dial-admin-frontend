name: PR Workflow

on:
  pull_request:
    branches: [development, release-*]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # Structural gate over .claude / .cursor / .github agent configuration: every
  # rule, skill, command, and settings file must keep parsing and loading. Runs
  # the validator's own test suite first, so a broken validator can't pass by
  # silently checking nothing.
  validate_agent_docs:
    name: Validate agent configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test agent-config validator
        run: npm run validate:agent-docs:test
      - name: Validate agent configuration
        run: npm run validate:agent-docs

  run_tests:
    uses: epam/ai-dial-ci/.github/workflows/node_pr.yml@4.9.0
    secrets: inherit
    with:
      node-version: 24
      maximize-build-space: true
