name: PR Workflow

on:
  pull_request:
    branches: [development, release-*]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # Structural gate over .claude / .cursor / .github agent configuration: every
  # rule, skill, command, and settings file must keep parsing and loading. Runs
  # the validator's own test suite first, so a broken validator can't pass by
  # silently checking nothing.
  validate_agent_docs:
    name: Validate agent configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test agent-config validator
        run: npm run validate:agent-docs:test
      - name: Validate agent configuration
        run: npm run validate:agent-docs

  # Types are the one thing neither `npm run lint` nor vitest sees: eslint ignores `*.spec.ts(x)` and
  # vitest strips types through esbuild. Both projects are hard gates at zero errors — the spec project
  # became one once the fixture debt catalogued in
  # openspec/changes/archive/2026-09-08-enable-typescript-typecheck-gate/proposal.md was cleared. The
  # spec step reports through scripts/report-spec-typecheck.mjs, so a red run names every file, groups
  # its errors in the log and annotates the lines they are on.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck app source
        run: npm run typecheck
      # tsc's output is captured, not streamed, so the reporter can group it by file, annotate the
      # offending lines and fill the job summary. Keep the shell to these three lines: whatever is
      # written here is echoed into the step log above the report, where the errors belong.
      - name: Typecheck spec files
        run: |
          npm run --silent typecheck:specs > spec-typecheck.log 2>&1 || status=$?
          node scripts/report-spec-typecheck.mjs spec-typecheck.log "${status:-0}"
          exit "${status:-0}"

  run_tests:
    uses: epam/ai-dial-ci/.github/workflows/node_pr.yml@4.12.0
    secrets: inherit
    with:
      node-version: 24
      maximize-build-space: true
